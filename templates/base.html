<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperShop BD – {% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#1e3a5f', light: '#2563eb' }
          }
        }
      }
    }
  </script>
  <style>
    :root{
      --green:    #044635;
      --orange:   #F17B0D;
      --dark:     #464646;
      --mid:      #646464;
      --cream:    #FFFCF1;
      --white:    #ffffff;
      --border:   #e5e7eb;
      --shadow:   0 4px 24px rgba(4,70,53,.10);
      --radius:   14px;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ── NAVBAR ── -->
  <nav class="bg-[#044635] text-white px-8 py-4 flex justify-between">

    <a href="/" class="font-bold text-2xl">
        🛒 SuperShop
    </a>

    <div class="flex gap-3">

        {% if role %}

            <a href="/products">Products</a>
            <a href="/sales">Sales</a>
            <a href="/inventory">Inventory</a>
            <a href="/branches">Branches</a>

            <a href="/auth/logout"
               class="bg-[#F17B0D] px-4 py-2 rounded-lg">
               Logout
            </a>

        {% else %}

            <a href="/auth/login"
               class="bg-[#F17B0D] px-4 py-2 rounded-lg">
               Login
            </a>

        {% endif %}

    </div>

</nav>

  <!-- ── PAGE CONTENT ── -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- ── FOOTER ── -->
  <footer class="text-center text-gray-400 text-xs py-6 mt-8 border-t border-gray-200">
    SuperShop Bangladesh · CSE-2201 Lab Project · University of Dhaka 2025
  </footer>

</body>
</html>
