<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found · SuperShop BD</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    :root{
      --green:#044635; --green-mid:#0a6b4f; --green-deep:#02241b;
      --orange:#F17B0D; --orange-deep:#c45f00; --orange-soft:#ffb35c;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"DM Sans",system-ui,sans-serif;
      color:#1f2937;
      background:
        radial-gradient(900px 500px at 90% -10%, rgba(241,123,13,.10), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(4,70,53,.10), transparent 60%),
        #f8faf9;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
    }
    .err-card{
      max-width:520px;width:100%;
      background:#fff;
      border:1px solid #eef2f1;
      border-radius:18px;
      padding:42px 36px 36px;
      text-align:center;
      box-shadow:0 22px 60px rgba(4,70,53,.10);
      position:relative;overflow:hidden;
    }
    .err-card::before{
      content:"";position:absolute;inset:0 0 auto 0;height:4px;
      background:linear-gradient(90deg,var(--green) 0%,var(--orange) 100%);
    }
    .err-badge{
      width:96px;height:96px;border-radius:50%;
      background:linear-gradient(135deg,#f0f9f4 0%,#fff7ec 100%);
      border:1px solid #e6efe9;
      display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
      box-shadow:inset 0 -6px 0 rgba(4,70,53,.05);
    }
    .err-badge i{
      font-size:38px;
      background:linear-gradient(135deg,var(--orange) 0%,var(--orange-deep) 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .err-code{
      font-family:"Plus Jakarta Sans",sans-serif;
      font-size:64px;font-weight:800;line-height:1;
      letter-spacing:-.04em;
      background:linear-gradient(135deg,var(--green) 0%,var(--green-mid) 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      margin-bottom:6px;
    }
    .err-eyebrow{
      font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
      color:var(--orange);margin-bottom:12px;display:inline-flex;align-items:center;gap:6px;
    }
    h1{
      font-family:"Plus Jakarta Sans",sans-serif;
      font-size:22px;font-weight:800;color:var(--green-deep);letter-spacing:-.01em;
      margin-bottom:10px;
    }
    p{font-size:14px;color:#64748b;line-height:1.6;max-width:380px;margin:0 auto 22px}
    .err-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:11px 20px;border-radius:10px;
      font-family:"DM Sans",sans-serif;font-size:13px;font-weight:700;
      border:none;cursor:pointer;text-decoration:none;transition:.15s;
    }
    .btn-primary{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(4,70,53,.25)}
    .btn-primary:hover{background:#033828;transform:translateY(-1px)}
    .btn-ghost{background:#f1f5f9;color:#475569}
    .btn-ghost:hover{background:#e2e8f0;color:#0f172a}
    .err-path{
      display:inline-block;margin-top:18px;
      font-family:monospace;font-size:11px;color:#94a3b8;
      padding:4px 10px;border-radius:6px;background:#f8faf9;border:1px solid #eef2f1;
      max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      direction:rtl;
    }
  </style>
</head>
<body>
  <main class="err-card" role="alert">
    <div class="err-badge"><i class="fa-solid fa-compass"></i></div>
    <div class="err-code">404</div>
    <div class="err-eyebrow"><i class="fa-solid fa-location-dot"></i> Wrong page</div>
    <h1>Sorry, we can't find this page</h1>
    <p>This page doesn't exist. Try going back, or open the home page.</p>
    <div class="err-actions">
      {% if is_logged_in and role in ['ADMIN', 'EMPLOYEE'] %}
        <button type="button" class="btn btn-primary" onclick="history.length>1 ? history.back() : (location.href='/')">
          <i class="fa-solid fa-arrow-left"></i> Go back
        </button>
      {% else %}
        <a href="/" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Back to home
        </a>
        <button type="button" class="btn btn-ghost" onclick="history.length>1 ? history.back() : (location.href='/')">
          <i class="fa-solid fa-arrow-left"></i> Go back
        </button>
      {% endif %}
    </div>
    {% if request_path %}
    <div class="err-path" title="{{ request_path }}">{{ request_path }}</div>
    {% endif %}
  </main>
</body>
</html>
